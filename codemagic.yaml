workflows:
  jos-android-debug:
    name: JOS Android - APK Debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Install Gradle 8.9
        script: |
          set -e
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --version
      - name: Build JOS APK
        script: |
          set -e
          /tmp/gradle-8.9/bin/gradle --no-daemon --stacktrace clean assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
